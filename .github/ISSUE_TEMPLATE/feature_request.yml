name: Feature request
description: Suggest an idea or improvement for Conduck
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For open-ended discussion, the [Discord](https://discord.gg/HqVwTmM7) is often faster. For anything large, open an issue to discuss direction before writing code — see [CONTRIBUTING.md](https://github.com/gigaduckai/conduck/blob/main/CONTRIBUTING.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Conduck makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Desired outcome
      description: What should Conduck make possible instead? You don't need to propose how it should be built.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Other approaches or workarounds you have tried or thought about.
    validations:
      required: false
