name: Bug report
description: Report a problem with Conduck
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. For questions or setup help, the [Discord](https://discord.gg/HqVwTmM7) is usually faster.

        **Do not report security vulnerabilities here.** See [SECURITY.md](https://github.com/gigaduckai/conduck/blob/main/SECURITY.md) — a public issue discloses the problem before a fix exists.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you observe, and what did you expect instead? Include the affected gateway or voice provider if relevant.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps that trigger the problem — or, for intermittent issues, when it tends to occur.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Build flavor
      options:
        - Community build from source
        - App Store build
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Affected platforms
      multiple: true
      options:
        - iOS
        - iPadOS
        - macOS
        - watchOS
        - CarPlay
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App, OS, and source version
      description: Write "Diagnostics below" if you paste the diagnostics report. Otherwise give the Conduck and OS versions, e.g. "Conduck 1.3 (57) on iOS 26.5". For builds from source, include the commit.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics report
      description: In Conduck, open Settings → Diagnostics, tap "Test everything", then "Copy Diagnostics" and paste the result here. Safe to share by design — it never contains API keys, tokens, URLs, transcripts, or file names.
      render: shell
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Additional log output
      description: "Optional console or log output beyond the diagnostics report. Before pasting, remove anything private: API keys, bearer tokens, gateway URLs, transcripts, prompts and replies, filenames, and account names. Conduck itself does not log these, but output from a modified build might."
      render: shell
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Screenshots or additional context
      description: Drag in screenshots or a screen recording, and add anything else that helps.
    validations:
      required: false
